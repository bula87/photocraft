[package]
name = "photocraft-portrait-filters"
description = "Host for third-party PhotoCraft portrait retouch packages (manifest.json + model.onnx)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# ONNX Runtime (native only). Wasm and default builds leave this off, the same way PhotoCraft
# leaves local ML out of the browser build. See docs/PORTRAIT_FILTERS.md.
onnx = ["dep:ort"]

[dependencies]
photocraft-color = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Prebuilt ONNX Runtime (MIT). Not linked into wasm: the dependency is native-only, so
# `--features onnx` cannot be enabled for wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
